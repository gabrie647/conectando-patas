name: CI

on:
  push:
  pull_request:

jobs:
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP 8.3 com as extensões do projeto
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: gd, curl, pdo_pgsql, mbstring
          coverage: none

      - name: Sintaxe PHP
        run: find backend tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Testes unitários
        run: php tests/testes.php

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sintaxe JavaScript
        run: find . -name "*.js" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: conectando_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://teste:teste@localhost:5432/conectando_teste?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Testar o banco (idempotência e esquema)
        run: bash tests/banco.sh
