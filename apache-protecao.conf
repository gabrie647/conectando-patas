# Bloqueia o acesso pelo navegador a arquivos internos do projeto.
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "/data-base">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(Dockerfile|docker-compose\.yml|init\.sh|\.env.*|\.gitignore|\.dockerignore|apache-protecao\.conf|conexao\.php|protecao\.php|email\.php|auth\.php|LEIA-ME.*\.txt)$">
    Require all denied
</FilesMatch>
