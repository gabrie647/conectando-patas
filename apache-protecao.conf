# Bloqueia o acesso pelo navegador a arquivos internos do projeto.
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "/(data-base|tests)">
    Require all denied
</DirectoryMatch>

<FilesMatch "^(Dockerfile|docker-compose\.yml|init\.sh|\.env.*|\.gitignore|\.dockerignore|apache-protecao\.conf|conexao\.php|protecao\.php|email\.php|auth\.php|imagem\.php|erros\.php|LEIA-ME.*\.txt)$">
    Require all denied
</FilesMatch>

# Cabeçalhos de segurança HTTP (exige mod_headers, ativado no Dockerfile).
<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()"
    # Só tem efeito quando o site é servido por HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.jsdelivr.net https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
</IfModule>
