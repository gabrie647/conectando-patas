services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_URL: ${APP_URL:-}
      APP_SALT: ${APP_SALT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_NOTIFY_EMAIL: ${CONTACT_NOTIFY_EMAIL:-}
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: conectando_patas_db
      POSTGRES_USER: ${POSTGRES_USER:-conectando_patas_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data-base/banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro

volumes:
  postgres_data:
