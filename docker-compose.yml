services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: conectando_patas_db
      POSTGRES_USER: ${POSTGRES_USER:-conectando_patas_db_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data-base/banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro

volumes:
  postgres_data:
