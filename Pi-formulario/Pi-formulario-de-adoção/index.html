<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro Pet | Conectando Patas</title>


    <!-- =========================
         BOOTSTRAP
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =========================
         BOOTSTRAP ICONS
    ========================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <!-- =========================
         FONTE
    ========================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>


<body>


    <!-- =================================================
         CONTAINER PRINCIPAL
    ================================================== -->

    <div class="container">


        <div class="formulario">


            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <div class="perfil">

                <div class="cabecalho">


                    <!-- ÍCONE -->

                    <div class="icone-logo">

                        <i class="bi bi-paw-fill"></i>

                    </div>


                    <!-- TÍTULO -->

                    <div class="titulo">

                        <h1>
                            Registro Pet
                        </h1>

                        <p>
                            Conte a história do seu amigo de quatro patas.
                        </p>

                    </div>


                    <!-- CORAÇÃO -->

                    <i class="bi bi-heart coracao"></i>


                </div>

            </div>



            <!-- =================================================
                 FORMULÁRIO
            ================================================== -->

            <form id="formulario">


                <!-- =================================================
                     INFORMAÇÕES
                ================================================== -->

                <div class="card card-informacoes">


                    <!-- CABEÇALHO -->

                    <div class="card-header">


                        <div class="icone-campo">

                            <i class="bi bi-chat-square-text"></i>

                        </div>


                        <div>

                            <h2>
                                Informações
                            </h2>

                            <span>
                                Fale sobre seu pet
                            </span>

                        </div>


                    </div>



                    <!-- CORPO -->

                    <div class="card-body">


                        <textarea
                            id="mensagem"
                            class="form-control"
                            placeholder="Conte sobre o pet: personalidade, hábitos, necessidades especiais..."
                        ></textarea>


                        <!-- PATA DECORATIVA -->

                        <i class="bi bi-paw-fill marca-pata"></i>


                    </div>

                </div>



                <!-- =================================================
                     FOTO E LOCALIZAÇÃO
                ================================================== -->

                <div class="row mt-3">


                    <!-- =================================================
                         FOTO
                    ================================================== -->

                    <div class="col-md-6">


                        <div class="card card-pequeno">


                            <!-- CABEÇALHO -->

                            <div class="card-header">


                                <div class="icone-campo">

                                    <i class="bi bi-camera"></i>

                                </div>


                                <div>

                                    <h2>
                                        Foto do Pet
                                    </h2>

                                    <span>
                                        Uma foto vale mais que mil latidos!
                                    </span>

                                </div>


                            </div>



                            <!-- CORPO -->

                            <div class="card-body">


                                <label
                                    for="foto"
                                    class="upload-area"
                                >


                                    <div class="upload-icone">

                                        <i class="bi bi-cloud-arrow-up"></i>

                                    </div>


                                    <strong>
                                        Clique para enviar
                                    </strong>


                                    <span>
                                        ou escolha uma imagem do seu computador
                                    </span>


                                </label>


                                <!-- INPUT REAL -->

                                <input
                                    type="file"
                                    id="foto"
                                    accept="image/*"
                                >


                                <!-- NOME DO ARQUIVO -->

                                <div id="nomeArquivo"></div>


                                <!-- PREVIEW -->

                                <div class="preview-container">

                                    <img
                                        id="preview"
                                        src=""
                                        alt="Pré-visualização da foto"
                                    >

                                </div>


                            </div>

                        </div>

                    </div>



                    <!-- =================================================
                         LOCALIZAÇÃO
                    ================================================== -->

                    <div class="col-md-6">


                        <div class="card card-pequeno">


                            <!-- CABEÇALHO -->

                            <div class="card-header">


                                <div class="icone-campo">

                                    <i class="bi bi-geo-alt"></i>

                                </div>


                                <div>

                                    <h2>
                                        Localização
                                    </h2>

                                    <span>
                                        Onde seu pet pode ser encontrado?
                                    </span>

                                </div>


                            </div>



                            <!-- CORPO -->

                            <div class="card-body">


                                <label
                                    for="localizacao"
                                    class="form-label"
                                >
                                    Localização
                                </label>


                                <input
                                    type="text"
                                    id="localizacao"
                                    class="form-control"
                                    placeholder="Digite a cidade ou bairro"
                                >


                                <!-- BOTÃO LOCALIZAÇÃO -->

                                <button
                                    type="button"
                                    id="btnLocalizacao"
                                    class="btn btn-secondary"
                                    title="Usar minha localização"
                                >

                                    <i class="bi bi-geo-alt"></i>

                                </button>


                                <!-- MAPA VISUAL -->

                                <div class="mapa">

                                    <div class="linhas-mapa"></div>

                                    <i class="bi bi-geo-alt-fill"></i>

                                </div>


                            </div>

                        </div>

                    </div>


                </div>



                <!-- =================================================
                     BOTÕES
                ================================================== -->

                <div class="acoes">


                    <!-- ENVIAR -->

                    <button
                        type="submit"
                        class="btn btn-success"
                    >

                        <i class="bi bi-send"></i>

                        <span>
                            Enviar Registro
                        </span>

                    </button>


                    <!-- LIMPAR -->

                    <button
                        type="reset"
                        class="btn btn-danger"
                        title="Limpar formulário"
                    >

                        <i class="bi bi-trash"></i>

                    </button>


                </div>


            </form>



            <!-- =================================================
                 SEGURANÇA
            ================================================== -->

            <div class="seguranca">

                <i class="bi bi-shield-check"></i>

                <span>
                    Suas informações estão seguras com a gente.
                </span>

            </div>


        </div>

    </div>



    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script src="./js/script.js"></script>


</body>

</html>
